<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Learning Roadmap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mind-elixir-core@2.0.0/dist/style.css">
    <script src="https://cdn.jsdelivr.net/npm/mind-elixir-core@2.0.0/dist/mind-elixir.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        let mind = {
            nodeData: {
                topic: 'Deep Learning Roadmap',
                children: [
                    {
                        topic: 'Fundamentals',
                        children: [
                            {
                                topic: 'Linear Algebra',
                                children: [
                                    { topic: 'Matrices and Vectors' },
                                    { topic: 'Eigenvalues and Eigenvectors' },
                                    { topic: 'Matrix Operations' }
                                ]
                            },
                            {
                                topic: 'Calculus',
                                children: [
                                    { topic: 'Derivatives' },
                                    { topic: 'Gradients' },
                                    { topic: 'Chain Rule' }
                                ]
                            }
                        ]
                    }
                ]
            }
        }

        let mindElixir = new MindElixir({
            el: '#map',
            direction: MindElixir.LEFT,
            data: mind,
            draggable: true,
            contextMenu: true,
            toolBar: true,
            nodeMenu: true,
            keypress: true,
            locale: 'en',
            theme: {
                name: 'dark',
                randomColor: false,
                color: '#f5f5f5',
                colorArray: ['#f5f5f5', '#e8e8e8', '#d9d9d9', '#bfbfbf', '#8c8c8c', '#595959', '#434343', '#262626', '#1f1f1f', '#141414']
            }
        })

        mindElixir.init()
    </script>
</body>
</html>
