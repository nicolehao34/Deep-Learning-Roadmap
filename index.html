<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkSight's Deep Learning Roadmap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mind-elixir-core@2.0.0/dist/style.css">
    <script src="https://cdn.jsdelivr.net/npm/mind-elixir-core@2.0.0/dist/mind-elixir.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        let mind = {
            nodeData: {
                topic: 'Deep Learning Roadmap',
                children: [
                    {
                        topic: 'Fundamentals',
                        children: [
                            {
                                topic: 'Linear Algebra',
                                children: [
                                    { topic: 'Matrices and Vectors' },
                                    { topic: 'Eigenvalues and Eigenvectors' },
                                    { topic: 'Matrix Operations' }
                                ]
                            },
                            {
                                topic: 'Calculus',
                                children: [
                                    { topic: 'Derivatives' },
                                    { topic: 'Gradients' },
                                    { topic: 'Chain Rule' }
                                ]
                            },
                            {
                                topic: 'Probability and Statistics',
                                children: [
                                    { topic: 'Probability Distributions' },
                                    { topic: 'Bayesian Statistics' },
                                    { topic: 'Statistical Inference' }
                                ]
                            }
                        ]
                    },
                    {
                        topic: 'Neural Networks',
                        children: [
                            { topic: 'Perceptron' },
                            {
                                topic: 'Activation Functions',
                                children: [
                                    { topic: 'Sigmoid' },
                                    { topic: 'ReLU' },
                                    { topic: 'Tanh' }
                                ]
                            },
                            { topic: 'Backpropagation' },
                            {
                                topic: 'Loss Functions',
                                children: [
                                    { topic: 'MSE' },
                                    { topic: 'Cross-Entropy' }
                                ]
                            }
                        ]
                    },
                    {
                        topic: 'Deep Learning Architectures',
                        children: [
                            {
                                topic: 'Convolutional Neural Networks (CNN)',
                                children: [
                                    { topic: 'Convolutional Layers' },
                                    { topic: 'Pooling Layers' },
                                    { topic: 'Fully Connected Layers' }
                                ]
                            },
                            {
                                topic: 'Recurrent Neural Networks (RNN)',
                                children: [
                                    { topic: 'LSTM' },
                                    { topic: 'GRU' }
                                ]
                            },
                            {
                                topic: 'Transformers',
                                children: [
                                    { topic: 'Attention Mechanism' },
                                    { topic: 'Self-Attention' },
                                    { topic: 'Multi-Head Attention' }
                                ]
                            }
                        ]
                    },
                    {
                        topic: 'Training and Optimization',
                        children: [
                            {
                                topic: 'Gradient Descent',
                                children: [
                                    { topic: 'Stochastic Gradient Descent' },
                                    { topic: 'Mini-batch Gradient Descent' }
                                ]
                            },
                            {
                                topic: 'Optimizers',
                                children: [
                                    { topic: 'Adam' },
                                    { topic: 'RMSprop' },
                                    { topic: 'Momentum' }
                                ]
                            },
                            {
                                topic: 'Regularization',
                                children: [
                                    { topic: 'Dropout' },
                                    { topic: 'L1/L2 Regularization' },
                                    { topic: 'Batch Normalization' }
                                ]
                            }
                        ]
                    },
                    {
                        topic: 'Applications',
                        children: [
                            {
                                topic: 'Computer Vision',
                                children: [
                                    { topic: 'Image Classification' },
                                    { topic: 'Object Detection' },
                                    { topic: 'Image Segmentation' }
                                ]
                            },
                            {
                                topic: 'Natural Language Processing',
                                children: [
                                    { topic: 'Text Classification' },
                                    { topic: 'Machine Translation' },
                                    { topic: 'Question Answering' }
                                ]
                            },
                            {
                                topic: 'Reinforcement Learning',
                                children: [
                                    { topic: 'Q-Learning' },
                                    { topic: 'Policy Gradients' },
                                    { topic: 'Deep Q-Networks' }
                                ]
                            }
                        ]
                    }
                ]
            }
        }

        let mindElixir = new MindElixir({
            el: '#map',
            direction: MindElixir.LEFT,
            data: mind,
            draggable: true,
            contextMenu: true,
            toolBar: true,
            nodeMenu: true,
            keypress: true,
            locale: 'en',
            theme: {
                name: 'dark',
                randomColor: false,
                color: '#f5f5f5',
                colorArray: ['#f5f5f5', '#e8e8e8', '#d9d9d9', '#bfbfbf', '#8c8c8c', '#595959', '#434343', '#262626', '#1f1f1f', '#141414']
            }
        })

        mindElixir.init()
    </script>
</body>
</html>
